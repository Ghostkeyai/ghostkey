[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Setelan sama dengan kontrak lain yang sudah hidup di Robinhood Chain (4663): solc 0.8.28 + cancun.
# solc 0.8.28 sudah ada di cache lokal (~/Library/Application Support/svm).
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Tanpa via_ir: kontraknya kecil, build biasa lebih mudah direproduksi pemeriksa (Sourcify).
bytecode_hash = "ipfs"
remappings = ["forge-std/=lib/forge-std/src/"]
# Tes hanya boleh MEMBACA vektor uji buatan server/merkle.mjs (bukti JS == Solidity).
fs_permissions = [{ access = "read", path = "./test/vectors.json" }]

[fuzz]
runs = 1000

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"

[lint]
lint_on_build = false
